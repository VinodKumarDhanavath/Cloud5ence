name: Build and deploy Cloud5ence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud5ence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cloud5ence_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        run: pnpm build

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload versioned JavaScript and CSS first
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: aws s3 sync ./out/_next/ "s3://${S3_BUCKET_NAME}/_next/" --cache-control "public,max-age=31536000,immutable" --only-show-errors

      - name: Upload site pages and public assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: aws s3 sync ./out/ "s3://${S3_BUCKET_NAME}/" --exclude "_next/*" --cache-control "public,max-age=0,must-revalidate" --only-show-errors

      - name: Invalidate CloudFront cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
